<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Poppins,sans-serif;background:#fff}
.welcome{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e293b);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#fff}
.bigPic{width:200px;height:200px;border-radius:50%;object-fit:cover;border:5px solid #16a34a}.openBtn{margin-top:24px;background:#fff;color:#0f172a;border:none;padding:16px 70px;border-radius:30px;font-size:22px;font-weight:900}
.lockS{position:fixed;inset:0;background:#fff;z-index:99990;display:none;flex-direction:column;align-items:center;padding-top:30px;overflow:hidden}
#dots{display:flex;gap:8px;margin:16px 0}.dot{width:14px;height:14px;border-radius:50%;border:2px solid #cbd5e1;display:none}.dot.on{background:#0f172a;border-color:#0f172a}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:280px;margin-top:12px}.numpad button{height:58px;border-radius:14px;border:none;background:#f8fafc;font-size:20px;font-weight:700}.numpad .ok{background:#0f172a;color:#fff}.numpad .del{background:#fff;border:1px solid #fee2e2;color:#ef4444}
.top{height:60px;background:#fff;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:10}
.menuSheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:5000;justify-content:flex-end}.menuSheet.show{display:flex}.sheetMenu{background:#fff;width:84%;max-width:340px;height:100%;padding:0;display:flex;flex-direction:column}
.menuTop{flex:1;overflow:auto;padding:18px}.menuBottom{padding:14px;background:#f8fafc;border-top:2px solid #e2e8f0;text-align:center}
.sheetMenu button{width:100%;text-align:left;padding:13px;border-radius:12px;border:1px solid #f1f5f9;background:#fff;margin-top:8px;font-weight:700}
.white{padding:0 14px 120px;max-width:480px;margin:0 auto}
.card{border:1px solid #f1f5f9;border-radius:18px;padding:12px;background:#fff;margin-top:12px}
.btn{width:100%;background:#16a34a;color:#fff;border:none;padding:14px;border-radius:16px;font-weight:800;margin-top:12px}
.note{border:1px solid #f1f5f9;background:#fff;border-radius:16px;padding:14px;margin-top:10px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:none;align-items:center;justify-content:center;padding:14px;visibility:hidden;opacity:0}
.modal.show{display:flex!important;visibility:visible!important;opacity:1!important;z-index:6000!important}
.readModal{background:#fff;width:92%;max-width:460px;max-height:85vh;border-radius:22px;padding:18px;overflow:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:30px;font-weight:700;font-size:13px;z-index:99999;display:none}
.theme-row{display:flex;gap:8px;margin-top:10px}.theme-row button{flex:1;padding:12px;border-radius:12px;border:2px solid #e2e8f0;font-weight:800;cursor:pointer}
.theme-green{background:#16a34a;color:#fff;border-color:#16a34a!important}.theme-blue{background:#2563eb;color:#fff;border-color:#2563eb!important}.theme-dark{background:#0f172a;color:#fff;border-color:#0f172a!important}
.secureBox{background:#fff7ed;border:2px solid #fdba74;padding:14px;border-radius:14px;margin-top:12px}
.hidden-pdf-div{position:fixed;left:-9999px;top:0;width:750px;background:#fff;color:#000;padding:0}
.editInput{width:100%;border:2px dashed #16a34a;border-radius:10px;padding:10px;font-size:16px;outline:none}
.wallpaperCard{position:relative;width:100%;height:280px;border-radius:20px;overflow:hidden;margin-top:12px;border:2px solid #e2e8f0;background:#f1f5f9}
.wallpaperBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wallpaperOverlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.3) 50%,rgba(0,0,0,0.1) 100%)}
.wallpaperContent{position:absolute;bottom:0;left:0;right:0;padding:14px;display:flex;align-items:center;gap:12px;color:#fff}
.wallpaperAvatar{width:68px;height:68px;border-radius:50%;border:3px solid #fff;object-fit:cover}
.wallpaperAddBtn{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.95);border:none;font-size:24px;font-weight:900;color:#0f172a;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:2}
.wallpaperRemoveBtn{position:absolute;top:12px;left:12px;padding:6px 10px;border-radius:20px;background:rgba(239,68,68,0.9);border:none;color:#fff;font-size:11px;font-weight:800;cursor:pointer;display:none}
</style></head><body>
<div id="toast" class="toast"></div>
<div id="welcome" class="welcome"><img src="logo.jpg" class="bigPic"><h1>ABDUL HADI</h1><button class="openBtn" onclick="openSetup()">Open</button><p style="margin-top:20px;font-size:11px;color:#64748b">© 2026 HADI KI DAIRAY<br>Developed by Abdul Hadi</p></div>
<div id="setup" style="position:fixed;inset:0;background:#fff;z-index:99998;display:none;flex-direction:column;padding:20px;overflow:auto"><h2 style="text-align:center">Create Password</h2><input id="setupPass" type="tel" maxlength="8" placeholder="Password" style="width:100%;height:52px;border:2px solid #e2e8f0;border-radius:14px;text-align:center;margin-top:12px"><input id="setupPass2" type="tel" maxlength="8" placeholder="Again Password" style="width:100%;height:52px;border:2px solid #e2e8f0;border-radius:14px;text-align:center;margin-top:12px"><input id="setupMobile" type="tel" maxlength="11" placeholder="Mobile 03XX" style="width:100%;height:52px;border:2px solid #e2e8f0;border-radius:14px;text-align:center;margin-top:12px"><p id="setupMsg" style="display:none;text-align:center;margin-top:8px;font-weight:700"></p><button class="btn" onclick="saveSetup()">Save</button><button onclick="backToWelcome()" style="width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid #e2e8f0;background:#fff">Back</button></div>
<div id="lockScreen" class="lockS"><img src="logo.jpg" style="width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #16a34a"><h2 style="margin-top:12px">HADI KI DAIRAY</h2><div id="dots"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div><div class="dot" id="d4"></div><div class="dot" id="d5"></div><div class="dot" id="d6"></div><div class="dot" id="d7"></div></div><p id="
err" style="color:#ef4444;display:none;font-weight:700">Wrong</p><div class="numpad"><button onclick="addN('1')">1</button><button onclick="addN('2')">2</button><button onclick="addN('3')">3</button><button onclick="addN('4')">4</button><button onclick="addN('5')">5</button><button onclick="addN('6')">6</button><button onclick="addN('7')">7</button><button onclick="addN('8')">8</button><button onclick="addN('9')">9</button><button onclick="delN()" class="del">⌫</button><button onclick="addN('0')">0</button><button onclick="checkN()" class="ok">✔</button></div><button onclick="openForget()" style="margin-top:12px;background:none;border:none;color:#2563eb;font-weight:700">Forget?</button><div id="forgetBox" style="display:none;width:92%;max-width:340px;margin-top:12px;background:#f8fafc;padding:14px;border-radius:14px;border:2px solid #16a34a"><input id="forgetMobile" type="tel" placeholder="Registered Mobile"><button onclick="sendCodeForget()" style="width:100%;margin-top:8px;background:#0f172a;color:#fff;border:none;padding:10px;border-radius:10px;font-weight:700">Send 6-Digit Code</button><div id="codeInputBox" style="display:none"><input id="codeInput" type="tel" maxlength="6" placeholder="6-Digit Code" style="width:100%;height:48px;border:2px solid #16a34a;border-radius:10px;text-align:center;margin-top:12px;letter-spacing:6px"><button onclick="verifyCodeForget()" style="width:100%;margin-top:8px;background:#16a34a;color:#fff;border:none;padding:12px;border-radius:10px">Verify & Open</button></div><p id="forgetMsg" style="display:none;text-align:center;margin-top:8px;font-weight:700"></p></div></div>
<div id="readModal" class="modal" onclick="if(event.target===this)closeRead()"><div class="readModal"><div style="display:flex;justify-content:space-between"><input id="readHead" class="editInput" style="display:none"><b id="readHeadView"></b><button onclick="closeRead()" style="border:none;background:#fef2f2;color:#ef4444;width:32px;height:32px;border-radius:50%">✕</button></div><small id="readDate" style="color:#94a3b8"></small><textarea id="readTextEdit" class="editInput" style="margin-top:12px;min-height:160px;display:none"></textarea><p id="readTextView" style="margin-top:12px;white-space:pre-wrap;font-size:18px;line-height:2"></p><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px"><button onclick="toggleEdit()" style="background:#0f172a;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:800">Edit</button><button onclick="copyCurrent()" style="background:#2563eb;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:800">Copy</button><button onclick="downloadPDFSingle()" style="background:#16a34a;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:800">PDF</button></div><button id="saveEditBtn" onclick="saveEdited()" style="width:100%;margin-top:8px;background:#16a34a;color:#fff;border:none;padding:10px;border-radius:10px;font-weight:800;display:none">Save</button><button onclick="deleteCurrent()" style="width:100%;margin-top:8px;background:#fef2f2;color:#ef4444;border:1px solid #fee2e2;padding:10px;border-radius:10px;font-weight:800">Delete</button></div></div>
<div id="menuSheet" class="menuSheet" onclick="if(event.target===this)closeMenu()"><div class="sheetMenu"><div class="menuTop"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><img src="logo.jpg" style="width:44px;height:44px;border-radius:50%"><div><b>HADI KI DAIRAY</b></div>
</div><button class="on" onclick="setView('home');closeMenu()">Home</button><button onclick="setView('settings');closeMenu()">Settings</button><button onclick="downloadPDFAll()" style="background:#eff6ff;color:#2563eb">PDF All</button><button onclick="lockK()" style="background:#fef2f2;color:#ef4444;margin-top:12px">Lock</button></div><div class="menuBottom"><p style="font-size:12px;font-weight:800;color:#0f172a">© 2026 HADI KI DAIRAY</p></div></div></div>
<div class="top"><button onclick="openMenu()" style="width:42px;height:42px;border-radius:12px;border:1px solid #f1f5f9;background:#fff">☰</button><div style="display:flex;align-items:center;gap:10px"><div style="font-weight:800;font-size:14px">HADI KI DAIRAY</div><img src="logo.jpg" style="width:36px;height:36px;border-radius:50%"></div></div>
<div class="white"><div id="homeView">
<div class="wallpaperCard" id="wallpaperCard"><img id="wallpaperBg" class="wallpaperBg" src="small.jpg"><div class="wallpaperOverlay"></div><button class="wallpaperAddBtn" onclick="document.getElementById('wallpaperInput').click()">+</button><button class="wallpaperRemoveBtn" id="removeWallpaperBtn" onclick="removeWallpaper()">✕ Remove</button><div class="wallpaperContent"><img src="small.jpg" class="wallpaperAvatar"><div style="flex:1"><div style="font-weight:900;font-size:18px">ABDUL HADI</div><div style="font-size:12px;opacity:0.9">HADI KI DAIRAY</div></div><img src="logo.jpg" style="width:48px;height:48px;border-radius:50%;border:2px solid #fff"></div></div>
<input type="file" id="wallpaperInput" accept="image/*" style="display:none" onchange="uploadWallpaper(event)">
<div class="card" style="margin-top:12px"><input id="headInput" placeholder="Heading" style="width:100%;height:44px;border:1.5px solid #f1f5f9;border-radius:10px;padding:0 12px"><textarea id="yaadInput" placeholder="Yahan likhen..." style="width:100%;min-height:100px;border:1.5px solid #f1f5f9;border-radius:10px;padding:12px;margin-top:8px"></textarea></div><button class="btn" onclick="saveYaad()">Save</button><div style="display:flex;justify-content:space-between;margin-top:14px;font-weight:800"><span>Saved</span><span id="c" style="color:#16a34a">0</span></div><div id="list"></div></div>
<div id="settingsView" style="display:none">
<div class="card" style="border:2px solid #16a34a"><b>Theme</b><div class="theme-row"><button class="theme-green" onclick="setTheme('green')">Green</button><button class="theme-blue" onclick="setTheme('blue')">Blue</button><button class="theme-dark" onclick="setTheme('dark')">Dark</button></div></div>
<div class="card secureBox"><b>Security</b>
<input id="settOldPass" type="tel" maxlength="8" placeholder="Old Password" style="margin-top:10px;width:100%;height:48px;border:2px solid #e2e8f0;border-radius:10px;text-align:center;font-weight:700">
<input id="settNewPass" type="tel" maxlength="8" placeholder="New Password" style="margin-top:10px;width:100%;height:48px;border:2px solid #e2e8f0;border-radius:10px;text-align:center;font-weight:700">
<input id="settAgainPass" type="tel" maxlength="8" placeholder="Again New Password" style="margin-top:10px;width:100%;height:48px;border:2px solid #e2e8f0;border-radius:10px;text-align:center;font-weight:700">
<button onclick="sendCodeSettings()" style="width:100%;margin-top:12px;background:#16a34a;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:800">Send Code</button>
<div id="settingsCodeBox" style="display:none;margin-top:12px;background:#fff;border:2p
x solid #16a34a;padding:12px;border-radius:12px"><input id="settingsCodeInput" type="tel" maxlength="6" placeholder="6-Digit Code" style="width:100%;height:48px;border:2px solid #16a34a;border-radius:10px;text-align:center;letter-spacing:6px;font-size:20px;font-weight:800"><button onclick="verifySettingsCode()" style="width:100%;margin-top:8px;background:#16a34a;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:800">Verify & Update</button></div>
<p id="settingsMsg" style="display:none;text-align:center;margin-top:10px;font-weight:700;font-size:13px"></p>
</div>

<script>
var currentReadId=null;var v='';var generatedCode='';var settingsCode='';var pendingPass='';
function getP(){return localStorage.getItem('myPass');}function getM(){return localStorage.getItem('myMobile');}
function backToWelcome(){document.getElementById('setup').style.display='none';document.getElementById('welcome').style.display='flex';hideAllModals();}
function openSetup(){hideAllModals();var p=getP();document.getElementById('welcome').style.display='none';if(p&&p.length>=4){document.getElementById('lockScreen').style.display='flex';upd();}else{document.getElementById('setup').style.display='flex';}}
function saveSetup(){var p=document.getElementById('setupPass').value.trim();var p2=document.getElementById('setupPass2').value.trim();var m=document.getElementById('setupMobile').value.trim();var msg=document.getElementById('setupMsg');if(p.length<4||p.length>8){msg.style.display='block';msg.style.color='#ef4444';msg.innerText='4-8 digit!';return;}if(p!==p2){msg.style.display='block';msg.style.color='#ef4444';msg.innerText='Not match!';return;}if(m.length<10){msg.style.display='block';msg.style.color='#ef4444';msg.innerText='Mobile!';return;}localStorage.setItem('myPass',p);localStorage.setItem('myMobile',m);msg.style.display='block';msg.style.color='#16a34a';msg.innerText='Done!';setTimeout(function(){document.getElementById('setup').style.display='none';document.getElementById('lockScreen').style.display='flex';v='';upd();},600);}
function addN(n){var pp=getP();var maxLen=pp?pp.length:8;if(v.length>=maxLen)return;v+=n;upd();if(pp&&v.length===pp.length)setTimeout(checkN,200);}
function delN(){v=v.slice(0,-1);upd();}
function upd(){var pp=getP();var maxLen=pp?pp.length:8;if(!maxLen)maxLen=8;for(var i=0;i<8;i++){var el=document.getElementById('d'+i);if(!el)continue;if(i<maxLen){el.style.display='flex';if(i<v.length)el.classList.add('on');else el.classList.remove('on');}else{el.style.display='none';}}}
function checkN(){hideAllModals();var pp=getP();if(v===pp){document.getElementById('lockScreen').style.display='none';v='';upd();setView('home');}else{var e=document.getElementById('err');e.style.display='block';setTimeout(function(){e.style.display='none';v='';upd();},800);}}
function hideAllModals(){var rm=document.getElementById('readModal');if(rm){rm.classList.remove('show');rm.style.display='none';rm.style.visibility='hidden';rm.style.opacity='0';} var ms=document.getElementById('menuSheet');if(ms)ms.classList.remove('show');}
function openForget(){var box=document.getElementById('forgetBox');box.style.display=box.style.display==='none'?'block':'none';}
function sendCodeForget(){var m=document.getElementById('forgetMobile').value.trim();var msg=document.getElementById('forgetMsg');if(m!==getM()){msg.style.display=
'block';msg.style.color='#ef4444';msg.innerText='Mobile ghalat!';return;}generatedCode=Math.floor(100000+Math.random()*900000).toString();msg.style.display='block';msg.style.color='#16a34a';msg.innerHTML='Code: <b style="font-size:22px;letter-spacing:6px">'+generatedCode+'</b>';document.getElementById('codeInputBox').style.display='block';}
function verifyCodeForget(){var c=document.getElementById('codeInput').value.trim();if(c===generatedCode){document.getElementById('lockScreen').style.display='none';document.getElementById('forgetBox').style.display='none';hideAllModals();v='';upd();setView('home');}}
function sendCodeSettings(){var oldPass=document.getElementById('settOldPass').value.trim();var newPass=document.getElementById('settNewPass').value.trim();var againPass=document.getElementById('settAgainPass').value.trim();var msg=document.getElementById('settingsMsg');if(oldPass!==getP()){msg.style.display='block';msg.style.color='#ef4444';msg.innerText='Old Password ghalat! '+getP();return;}if(newPass.length<4||newPass.length>8){msg.style.display='block';msg.style.color='#ef4444';msg.innerText='New Password 4-8 digit';return;}if(newPass!==againPass){msg.style.display='block';msg.style.color='#ef4444';msg.innerText='Match nahi!';return;}pendingPass=newPass;settingsCode=Math.floor(100000+Math.random()*900000).toString();msg.style.display='block';msg.style.color='#16a34a';msg.innerHTML='Code: <b style="font-size:22px;letter-spacing:4px">'+settingsCode+'</b>';document.getElementById('settingsCodeBox').style.display='block';}
function verifySettingsCode(){var code=document.getElementById('settingsCodeInput').value.trim();var msg=document.getElementById('settingsMsg');if(code!==settingsCode){msg.style.display='block';msg.style.color='#ef4444';msg.innerText='Code ghalat!';return;}localStorage.setItem('myPass',pendingPass);msg.style.display='block';msg.style.color='#16a34a';msg.innerText='Update ho gaya!';setTimeout(function(){document.getElementById('settingsCodeBox').style.display='none';document.getElementById('settOldPass').value='';document.getElementById('settNewPass').value='';document.getElementById('settAgainPass').value='';document.getElementById('settingsCodeInput').value='';msg.style.display='none';setView('home');},1500);}
function openMenu(){hideAllModals();document.getElementById('menuSheet').classList.add('show')}function closeMenu(){document.getElementById('menuSheet').classList.remove('show')}
function setView(view){hideAllModals();document.getElementById('homeView').style.display='none';document.getElementById('settingsView').style.display='none';if(view==='home')document.getElementById('homeView').style.display='block';if(view==='settings')document.getElementById('settingsView').style.display='block';loadY();}
function saveYaad(){var h=document.getElementById('headInput').value.trim();var t=document.getElementById('yaadInput').value.trim();if(!h||!t){alert('Heading+Story!');return;}var a=JSON.parse(localStorage.getItem('y')||'[]');a.unshift({id:Date.now(),heading:h,text:t,date:new Date().toLocaleString(),ts:Date.now()});localStorage.setItem('y',JSON.stringify(a));document.getElementById('headInput').value='';document.getElementById('yaadInput').value='';loadY();}
function loadY(){var a=JSON.parse(localStorage.getItem('y')||'[]');document.getElementById('c').innerText=a.length;var l=document.getElementById('list');l.innerHTML='';for(var i=0;i<a.length;i++){var y=a[i];var div=document.createElement('div');div.className='not
e';(function(id){div.onclick=function(){openRead(id);}})(y.id);div.innerHTML='<h4>'+y.heading+'</h4><small>'+y.date+'</small><p style="margin-top:6px;color:#64748b">'+y.text.substring(0,60)+'</p>';l.appendChild(div);}}
function openRead(id){hideAllModals();var a=JSON.parse(localStorage.getItem('y')||'[]');var y=null;for(var i=0;i<a.length;i++)if(a[i].id===id){y=a[i];break;}if(!y)return;currentReadId=id;document.getElementById('readHeadView').innerText=y.heading;document.getElementById('readHead').value=y.heading;document.getElementById('readDate').innerText=y.date;document.getElementById('readTextView').innerText=y.text;document.getElementById('readTextEdit').value=y.text;var rm=document.getElementById('readModal');rm.style.display='flex';rm.style.visibility='visible';rm.style.opacity='1';rm.classList.add('show');}
function toggleEdit(){var hv=document.getElementById('readHeadView');var he=document.getElementById('readHead');var tv=document.getElementById('readTextView');var te=document.getElementById('readTextEdit');var sb=document.getElementById('saveEditBtn');if(hv.style.display!=='none'){hv.style.display='none';tv.style.display='none';he.style.display='block';te.style.display='block';sb.style.display='block';}else{hv.style.display='block';tv.style.display='block';he.style.display='none';te.style.display='none';sb.style.display='none';}}
function saveEdited(){var a=JSON.parse(localStorage.getItem('y')||'[]');for(var i=0;i<a.length;i++)if(a[i].id===currentReadId){a[i].heading=document.getElementById('readHead').value; a[i].text=document.getElementById('readTextEdit').value; break;}localStorage.setItem('y',JSON.stringify(a));document.getElementById('readHeadView').innerText=document.getElementById('readHead').value;document.getElementById('readTextView').innerText=document.getElementById('readTextEdit').value;toggleEdit();loadY();}
function closeRead(){hideAllModals();}
function showToast(m){var t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(function(){t.style.display='none';},2500);}
function copyCurrent(){var a=JSON.parse(localStorage.getItem('y')||'[]');var y=null;for(var i=0;i<a.length;i++)if(a[i].id===currentReadId){y=a[i];break;}if(!y)return;var textToCopy=y.heading+'\n\n'+y.text+'\n\n'+y.date;if(navigator.clipboard){navigator.clipboard.writeText(textToCopy).then(function(){showToast('Copied!');});}}
function deleteCurrent(){var a=JSON.parse(localStorage.getItem('y')||'[]');a=a.filter(function(x){return x.id!==currentReadId});localStorage.setItem('y',JSON.stringify(a));closeRead();loadY();}
function setTheme(t){localStorage.setItem('appTheme',t);var toast=document.getElementById('toast');if(t==='green'){document.body.style.background='#f0fdf4';document.body.style.color='#000';toast.innerText='Green Theme!';} else if(t==='blue'){document.body.style.background='#eff6ff';document.body.style.color='#000';toast.innerText='Blue Theme!';} else if(t==='dark'){document.body.style.background='#0f172a';document.body.style.color='#fff';toast.innerText='Dark Theme!';} toast.style.display='block';setTimeout(function(){toast.style.display='none';},2000);}
function uploadWallpaper(event){var file=event.target.files[0];if(!file) return;var reader=new FileReader();reader.onload=function(e){var data=e.target.result;localStorage.setItem('wallpaperImg',data);document.getElementById('wallpaperBg').src=data;document.getElementById('removeWallpaperBtn').style.display='block';showToast('Wallpaper lag gaya!');};reader.
readAsDataURL(file);}
function removeWallpaper(){localStorage.removeItem('wallpaperImg');document.getElementById('wallpaperBg').src='small.jpg';document.getElementById('removeWallpaperBtn').style.display='none';showToast('Wallpaper hat gaya');}
function loadWallpaper(){var saved=localStorage.getItem('wallpaperImg');if(saved){document.getElementById('wallpaperBg').src=saved;document.getElementById('removeWallpaperBtn').style.display='block';}}
function lockK(){hideAllModals();document.getElementById('welcome').style.display='flex';document.getElementById('lockScreen').style.display='none';setTimeout(function(){document.getElementById('welcome').style.display='none';document.getElementById('lockScreen').style.display='flex';v='';upd();},100);}
async function makePDFfromDiv(h,f){var div=document.getElementById('pdfRender');div.innerHTML='<div style="width:700px;padding:40px;background:#fff;color:#000">'+h+'</div>';if(document.fonts) await document.fonts.ready;await new Promise(r=>setTimeout(r,500));var canvas=await html2canvas(div.firstChild,{scale:2,useCORS:true,backgroundColor:'#ffffff'});var imgData=canvas.toDataURL('image/png');var pdf=new jspdf.jsPDF('p','mm','a4');var w=pdf.internal.pageSize.getWidth();var h2=(canvas.height*w)/canvas.width;pdf.addImage(imgData,'PNG',0,0,w,h2);pdf.save(f);div.innerHTML='';}
async function downloadPDFSingle(){var a=JSON.parse(localStorage.getItem('y')||'[]');var y=null;for(var i=0;i<a.length;i++)if(a[i].id===currentReadId){y=a[i];break;}if(!y)return;var h='<div style="padding:30px"><h2>'+y.heading+'</h2><p>'+y.date+'</p><div style="margin-top:20px;white-space:pre-wrap">'+y.text+'</div></div>';await makePDFfromDiv(h,(y.heading||'diary')+'.pdf');}
async function downloadPDFAll(){var a=JSON.parse(localStorage.getItem('y')||'[]');if(a.length===0)return;var h='<div style="padding:30px"><h1>HADI KI DAIRAY</h1>';for(var i=0;i<a.length;i++){h+='<div style="margin-bottom:20px;border:2px solid #000;padding:15px"><h3>'+a[i].heading+'</h3><p>'+a[i].date+'</p><div>'+a[i].text+'</div></div>';}h+='</div>';await makePDFfromDiv(h,'HADI_KI_DAIRAY_All.pdf');}
(function(){document.getElementById('welcome').style.display='flex';hideAllModals();loadY();loadWallpaper();})();
</script></body></html>
