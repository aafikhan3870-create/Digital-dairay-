<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Dairay - ABDUL HADI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background:#09090b;color:#e4e4e7;margin:0;font-family:system-ui">

<!-- Right Bar like Firebase -->
<div style="position:fixed;right:0;top:0;bottom:0;width:58px;background:#18181b;border-left:1px solid #27272a;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:18px;z-index:50">
<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(to br,#fcd34d,#ea580c);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900">AH</div>
<div style="width:28px;height:1px;background:#27272a"></div>
<div>🔔</div><div>✨</div><div>💬</div><div>❓</div>
</div>

<div style="margin-right:58px;min-height:100vh;display:flex;flex-direction:column">
<div style="height:56px;background:#121214;border-bottom:1px solid #27272a;display:flex;align-items:center;justify-content:space-between;padding:0 16px">
<h1 style="margin:0;font-weight:900">Digital <span style="color:#fbbf24">Dairay</span> <span style="font-size:11px;color:#71717a">by ABDUL HADI</span></h1>
<span style="font-size:11px;background:#052e1f;color:#34d399;padding:5px 12px;border-radius:20px;border:1px solid #065f46">● LIVE</span>
</div>

<div style="flex:1;display:flex;flex-wrap:wrap">
<div style="flex:2;min-width:300px;padding:16px;background:#0a0a0b">
<div style="background:#18181b;border:1px solid #27272a;border-radius:20px;padding:16px">
<textarea id="storyInput" placeholder="Apni kahani likho..." style="width:100%;background:#1f1f23;border:1px solid #2a2a2e;border-radius:12px;padding:12px;color:#fff;min-height:90px"></textarea>
<button onclick="postStory()" style="margin-top:10px;background:#fff;color:#000;font-weight:700;padding:8px 24px;border-radius:20px;border:none">Post Karo</button>
</div>
<div id="storiesFeed" style="margin-top:16px"></div>
</div>

<div style="flex:1;min-width:280px;background:#121214;border-right:1px solid #27272a;display:flex;flex-direction:column">
<div style="padding:14px;border-bottom:1px solid #27272a;display:flex;justify-content:space-between"><b>Live Chat</b><span id="onlineCount" style="font-size:11px;color:#71717a">0</span></div>
<div id="chatMessages" style="flex:1;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px"></div>
<div style="padding:12px;border-top:1px solid #27272a;display:flex;gap:6px">
<input id="userName" placeholder="Naam" style="width:60px;background:#1f1f23;border:1px solid #2a2a2e;border-radius:20px;padding:10px;color:#fff;font-size:11px">
<input id="chatInput" placeholder="Paigham..." style="flex:1;background:#1f1f23;border:1px solid #2a2a2e;border-radius:20px;padding:10px;color:#fff">
<button onclick="sendMessage()" style="background:#fbbf24;color:#000;width:38px;height:38px;border-radius:50%;border:none;font-weight:700">↑</button>
</div>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDrxztt_wMInNZ2SsYuA_Z0KfPdUhMWZDM",
  authDomain: "aafi-khan.firebaseapp.com",
  projectId: "aafi-khan",
  storageBucket: "aafi-khan.firebasestorage.app",
  messagingSenderId: "225988422863",
  appId: "1:225988422863:web:f1be7832f1ee1ab52b9bba",
  measurementId: "G-RZPCEXZ3Q7"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const chatCol = collection(db, "hadi_chats");
const storyCol = collection(db, "hadi_stories");
window.sendMessage = async () => {
  const n = document.getElementById('userName').value || "Mehman";
  const t = document.getElementById('chatInput').value.trim();
  if(!t) return; document.getElementById('chatInput').value="";
  await addDoc(chatCol, { name: n, text: t, created: Date.now(), time: serverTimestamp() });
};
window.postStory = async () => {
  const t = document.getElementById('storyInput').value.trim();
  if(!t) return; document.getElementById('storyInput').value="";
  await addDoc(storyCol, { text: t, created: Date.now() });
};
const qChat = query(chatCol, orderBy("created","asc"));
onSnapshot(qChat, (snap)=>{
  const box=document.getElementById('chatMessages'); box.innerHTML=""; let c=0;
  snap.forEach(d=>{ const data=d.data(); const div=document.createElement('div'); div.style.cssText="background:#1e1e20;border-radius:14px;padding:10px;border:1px solid #27272a"; div.innerHTML=`<b style="color:#fbbf24;font-size:11px">${data.name}</b> <span style="font-size:10px;color:#71717a"> ${new Date(data.created).toLocaleTimeString()}</span><div style="margin-top:4px;font-size:13px">${data.text}</div>`; box.appendChild(div); c++; });
  document.getElementById('onlineCount').innerText=c+" messages"; box.scrollTop=box.scrollHeight;
});
const qStory = query(storyCol, orderBy("created","desc"));
onSnapshot(qStory, (snap)=>{
  const feed=document.getElementById('storiesFeed'); feed.innerHTML="";
  snap.forEach(d=>{ const data=d.data(); const div=document.createElement('div'); div.style.cssText="background:#18181b;border:1px solid #27272a;border-radius:18px;padding:14px;margin-bottom:12px"; div.innerHTML=`<div>${data.text}</div><div style="font-size:10px;color:#71717a;margin-top:8px">${new Date(data.created).toLocaleString()}</div>`; feed.appendChild(div); });
});
document.getElementById('chatInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendMessage(); });
</script>
</body>
</html>
