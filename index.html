:root{--green:#16a34a;--bg:#fff;--card:#fff;--text:#0f172a;--border:#f1f5f9}

.card .langRow button.on{background:var(--text);color:#fff;border-color:var(--text)}
.card input{width:100%;border:none;border-bottom:1px dashed var(--border);padding-bottom:8px;margin-bottom:8px;font-weight:700;font-size:20px;outline:none;background:transparent}

.btn{width:100%;background:var(--green);color:#fff;border:none;padding:14px;border-radius:16px;font-weight:800;margin-top:12px;font-size:18px}
.tabs{display:flex;gap:8px;margin-top:14px;overflow:auto}.tabs button{padding:9px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);font-weight:700;font-size:13px;white-space:nowrap}.tabs button.on{background:var(--text);color:#fff}
.note{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:14px;margin-top:10px;cursor:pointer;transition:.2s}
.note:active{transform:scale(.98)}
.note h4{font-size:18px}
.lockS{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;padding-top:50px;z-index:9999}
.lockS .l1{width:110px;height:110px;border-radius:26px;object-fit:cover}.lockS .l2{width:74px;height:74px;border-radius:50%;margin-top:-18px;border:4px solid #fff;box-shadow:0 8px 18px rgba(0,0,0,.12);object-fit:cover}
#dots{display:flex;gap:10px;margin:16px 0}.dot{width:14px;height:14px;border-radius:50%;border:2px solid #cbd5e1}.dot.on{background:#0f172a;border-color:#0f172a}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:280px;margin-top:16px}.numpad button{height:64px;border-radius:18px;border:none;background:#f8fafc;font-size:22px;font-weight:700}.numpad .ok{background:#0f172a;color:#fff}.numpad .del{background:#fff;border:1px solid #fee2e2;color:#ef4444}

.sheetMenu{background:var(--card);width:82%;max-width:320px;height:100%;padding:18px;overflow:auto;animation:sl .25s ease}
@keyframes sl{from{transform:translateX(-100%)}to{transform:translateX(0)}}
.sheetMenu button{width:100%;text-align:right;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--card);margin-top:8px;font-weight:700;font-size:15px}
.sheetMenu button.on{background:var(--text);color:#fff}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:10002;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.modal img{max-width:90vw;max-height:80vh;border-radius:20px}
.readModal{background:#fff;width:92%;max-width:460px;max-height:85vh;border-radius:22px;padding:18px;overflow:auto;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

</style></head><body>

<script>
const LANG={ur:{search:"🔍 تلاش کریں...",heading:"ہیڈنگ",story:"یہاں اپنی کہانی لکھیں... ا، ب، پ، ت، ٹ...",save:"محفوظ کریں",today:"آج",weekly:"ہفتہ وار",monthly:"ماہانہ",all:"تمام",allNotes:"تمام نوٹس",home:"ہوم",noteBook:"📒 نوٹ بک",sec:"🔐 سیکیورٹی",pass:"🔑 پاسورڈ تبدیل",sett:"⚙️ سیٹنگ",lock:"🔒 لاک",theme:"🎨 تھیم",profile:"عبد الہادی",lockName:"عبد الہادی",passTitle:"🔑 پاسورڈ تبدیل",passSave:"محفوظ کریں",passCancel:"واپس",footer:"© 2026 عبد الہادی<br>ڈیجیٹل ڈائری",themeFooter:"© عبد الہادی<br>ڈیجیٹل ڈائری<br>جمیل نوری نستعلیق میں<br>2026",wrong:"غلط کوڈ",noRes:"🌱 کوئی نتیجہ نہیں",notFound:"نہیں ملا",found:"نتیجہ"},en:{search:"🔍 Search...",heading:"Heading",story:"Write here... A, B, C, D, E...",save:"Save",today:"Today",weekly:"Weekly",monthly:"Monthly",all:"All",allNotes:"All Notes",home:"Home",noteBook:"📒 NOTE BOOK",sec:"🔐 SECURITY",pass:"🔑 Change Password",sett:"⚙️ Settings",lock:"🔒 Lock",theme:"🎨 Theme",profile:"ABDUL HADI",lockName:"ABDUL HADI",passTitle:"🔑 Change Password",passSave:"Save",passCancel:"Cancel",footer:"© 2026 ABDUL HADI<br>Digital Diary",themeFooter:"© ABDUL HADI<br>Digital Diary<br>In Jameel Noori Nastaleeq<br>2026",wrong:"Wrong Code",noRes:"🌱 No result",notFound:"not found",found:"result"}};
let deferredPrompt;
let currentFont='f-urdu1';
function getP(){return localStorage.getItem('myPass')||'2938'}
let v='';
function addN(n){ if(v.length>=4) return; v+=n; upd(); if(v.length===4) setTimeout(checkN,250); }
function delN(){ v=v.slice(0,-1); upd(); }
function upd(){ for(let i=0;i<4;i++){ let el=document.getElementById('d'+i); if(el) el.classList.toggle('on', i < v.length); } }
function checkN(){ let p=getP(); if(v===p){ document.getElementById('lockScreen').style.display='none'; v=''; upd(); }else if(v.length===4){ let e=document.getElementById('err'); e.style.display='block'; setTimeout(()=>{ e.style.display='none'; v=''; upd(); },800); } }
document.getElementById('d').innerText=new Date().toLocaleDateString('ur-PK',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
function openMenu(){document.getElementById('menuSheet').classList.add('show')}function closeMenu(){document.getElementById('menuSheet').classList.remove('show')}function openPass(){document.getElementById('passBox').style.display='flex'}function closePass(){document.getElementById('passBox').style.display='none'}function savePass(){let o=document.getElementById('oldP').value.trim(),n=document.getElementById('newP').value.trim(),n2=document.getElementById('newP2').value.trim(),m=document.getElementById('pMsg');let curL=localStorage.getItem('fullLang')||'ur';if(o!==getP()){m.style.display='block';m.style.color='#ef4444';m.innerText=curL==='ur'?'پرانا غلط!':'Old wrong!';return}if(n.length!==4){m.style.display='block';m.style.color='#ef4444';m.innerText=curL==='ur'?'4 نمبر!':'4 digits!';return}if(n!==n2){m.style.display='block';m.style.color='#ef4444';m.innerText=curL==='ur'?'میچ نہیں!':'Not match!';return}localStorage.setItem('myPass',n);m.style.display='block';m.style.color='#16a34a';m.innerText=curL==='ur'?'✅ ہو گیا!':'✅ Done!';setTimeout(closePass,1000)}function goHome(){setView('home');let img=document.getElementById('profImg');document.getElementById('bigPic').src=img.src;document.getElementById('picModal').classList.add('show');setTimeout(()=>document.getElementById('picModal').classList.remove('show'),1100)}
let cur='home';
function setView(view){
 cur=view;
 document.querySelectorAll('.sheetMenu button').forEach(b=>b.classList.remove('on'));
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));
 if(view==='home'){
   document.getElementById('mHome').classList.add('on');
   document.getElementById('homeView').style.display='block';
   document.getElementById('listWrap').style.display='block';
   document.getElementById('settingsView').style.display='none';
   document.getElementById('listName').innerText=LANG[localStorage.getItem('fullLang')||'ur'].allNotes;
   document.getElementById('tAll').classList.add('on');
 }else if(view==='settings'){
   document.getElementById('homeView').style.display='none';
   document.getElementById('listWrap').style.display='none';
   document.getElementById('settingsView').style.display='block';
 }else{
   document.getElementById('homeView').style.display='none';
   document.getElementById('settingsView').style.display='none';
   document.getElementById('listWrap').style.display='block';
   let L=LANG[localStorage.getItem('fullLang')||'ur'];
   if(view==='today'){document.getElementById('mToday').classList.add('on');document.getElementById('tToday').classList.add('on');document.getElementById('listName').innerText=L.today}
   if(view==='weekly'){document.getElementById('mWeekly').classList.add('on');document.getElementById('tWeekly').classList.add('on');document.getElementById('listName').innerText=L.weekly}
   if(view==='monthly'){document.getElementById('mMonthly').classList.add('on');document.getElementById('tMonthly').classList.add('on');document.getElementById('listName').innerText=L.monthly}
   if(view==='all'){document.getElementById('tAll').classList.add('on');document.getElementById('listName').innerText=L.allNotes}
 }
 loadY();
}
function isToday(ts){return new Date(ts).toDateString()===new Date().toDateString()}
function isWeekly(ts){return (Date.now()-ts)/86400000<=7}
function isMonthly(ts){let d=new Date(ts),n=new Date();return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()}

function setFont(f){
 currentFont=f;
 localStorage.setItem('selFont',f);
 document.querySelectorAll('#fontUrduRow button, #fontEngRow button').forEach(b=>b.classList.remove('on'));
 let el=document.getElementById(f==='f-urdu1'?'fU1':f==='f-urdu2'?'fU2':f==='f-urdu3'?'fU3':f==='f-eng1'?'fE1':f==='f-eng2'?'fE2':'fE3');
 if(el) el.classList.add('on');
 document.getElementById('yaadInput').className=f;
 document.getElementById('headInput').className=f;
}

function saveYaad(){
 let h=document.getElementById('headInput').value.trim(),t=document.getElementById('yaadInput').value.trim();
 let curL=localStorage.getItem('fullLang')||'ur';
 if(!h)return alert(curL==='ur'?'ہیڈنگ لکھیں!':'Write Heading!');
 if(!t)return alert(curL==='ur'?'کہانی لکھیں!':'Write story!');
 let a=JSON.parse(localStorage.getItem('y')||'[]');
 a.unshift({id:Date.now(),heading:h,text:t,date:new Date().toLocaleString(curL==='ur'?'ur-PK':'en-US'),ts:Date.now(),lang:curL,font:currentFont});
 localStorage.setItem('y',JSON.stringify(a));
 document.getElementById('headInput').value='';document.getElementById('yaadInput').value='';
 loadY();setView('home');
}

function doSearch(){let q=document.getElementById('searchInput').value.toLowerCase().trim();let r=document.getElementById('sRes');if(q){r.style.display='block';setView('all');}else{r.style.display='none'}loadY(q)}

function loadY(sq){
 let a=JSON.parse(localStorage.getItem('y')||'[]');let f=a;
 if(cur==='today')f=a.filter(x=>isToday(x.ts));else if(cur==='weekly')f=a.filter(x=>isWeekly(x.ts));else if(cur==='monthly')f=a.filter(x=>isMonthly(x.ts));

function openRead(id){
 let a=JSON.parse(localStorage.getItem('y')||'[]');
 let y=a.find(x=>x.id===id);
 if(!y) return;
 document.getElementById('readHead').innerText='📌 '+y.heading;
 document.getElementById('readHead').className=y.font||'f-urdu1';
 document.getElementById('readDate').innerText=y.date;
 document.getElementById('readText').innerText=y.text;
 document.getElementById('readText').className=y.font||'f-urdu1';
 document.getElementById('readDel').setAttribute('onclick','delY('+y.id+');closeRead()');
 document.getElementById('readModal').classList.add('show');
}
function closeRead(){ document.getElementById('readModal').classList.remove('show'); }
function delY(id){if(!confirm('Delete?'))return;let a=JSON.parse(localStorage.getItem('y')||'[]');a=a.filter(x=>x.id!==id);localStorage.setItem('y',JSON.stringify(a));loadY()}

<script>
const installBox=document.getElementById('installBox');
const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
function showInstallBox(){if(!isStandalone)installBox.style.display='flex';}
function hideInstallBox(){installBox.style.display='none';}
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;showInstallBox();});
setTimeout(()=>{if(!isStandalone)showInstallBox();},1500);
function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(ch=>{if(ch.outcome==='accepted')hideInstallBox();deferredPrompt=null;});}}
window.addEventListener('appinstalled',()=>{hideInstallBox();});
if(isStandalone)hideInstallBox();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
