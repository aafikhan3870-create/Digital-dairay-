<!DOCTYPE html>
<html translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<meta name="googlebot" content="notranslate">
<title>Digital Dairay - My Personal Diary</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body.notranslate{background:#0f172a;color:white;font-family:system-ui;min-height:100vh}
.login-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:20px}
.login-screen img{width:120px;height:120px;border-radius:20px;margin-bottom:20px;border:3px solid #22c55e}
.login-screen h2{margin-bottom:15px}
.login-screen input{padding:12px 15px;border-radius:10px;border:none;width:260px;text-align:center;font-size:18px;margin-bottom:12px}
.login-screen button{padding:12px 25px;background:#22c55e;color:white;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}
.app{display:none;min-height:100vh}
.header{background:#1e293b;padding:15px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.header img{width:45px;height:45px;border-radius:10px}
.menu{display:flex;gap:8px;padding:15px;background:#1e293b;overflow-x:auto}
.menu button{padding:10px 18px;border-radius:20px;border:1px solid #334155;background:#0f172a;color:#94a3b8;white-space:nowrap;cursor:pointer}
.menu button.active{background:#22c55e;color:white;border-color:#22c55e;font-weight:bold}
.content{padding:20px;max-width:700px;margin:0 auto}
.write-box{background:#1e293b;padding:20px;border-radius:15px;margin-bottom:20px}
.write-box h3{margin-bottom:12px;color:#22c55e}
.write-box textarea{width:100%;min-height:150px;background:#0f172a;border:1px solid #334155;color:white;padding:15px;border-radius:10px;font-size:16px;resize:vertical}
.write-box button{margin-top:12px;padding:12px 20px;background:#22c55e;color:white;border:none;border-radius:10px;font-weight:bold;cursor:pointer;width:100%}
.note-card{background:#1e293b;padding:16px;border-radius:12px;margin-bottom:12px;border-left:4px solid #22c55e}
.note-card .date{color:#22c55e;font-size:13px;font-weight:bold;margin-bottom:6px}
.note-card .text{color:#e2e8f0;line-height:1.6;white-space:pre-wrap}
#installBox{position:fixed;bottom:20px;left:15px;right:15px;background:#22c55e;color:white;padding:14px 18px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;z-index:500;box-shadow:0 5px 20px rgba(0,0,0,0.4)}
#installBox button{background:white;color:#22c55e;border:none;padding:8px 16px;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body class="notranslate" translate="no">

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
<img src="logo.jpg" alt="Logo">
<h2>Digital Dairay</h2>
<p style="color:#94a3b8;margin-bottom:15px">Apna Password Likho</p>
<input type="password" id="passInput" placeholder="Password">
<button onclick="checkPass()">Andar Jao</button>
<p id="loginError" style="color:#ef4444;margin-top:10px;display:none">Ghalat Password!</p>
</div>

<!-- APP -->
<div id="mainApp" class="app">
<div class="header">
<img src="logo.jpg" alt="logo">
<div><b>Digital Dairay</b><div style="font-size:12px;color:#94a3b8">My Personal Diary</div></div>
</div>
<div class="menu">
<button id="btnToday" class="active" onclick="showTab('today')">📅 Today</button>
<button id="btnWeekly" onclick="showTab('weekly')">📊 Weekly</button>
<button id="btnMonthly" onclick="showTab('monthly')">📆 Monthly</button>
<button id="btnAll" onclick="showTab('all')">📔 All Notes</button>
</div>
<div class="content">
<div id="todayTab">
<div class="write-box">
<h3>✍️ Aaj Ki Kahani Likho</h3>
<textarea id="todayText" placeholder="Aaj kya hua? Apni kahani yahan likho..."></textarea>
<button onclick="saveToday()">💾 Save Karo</button>
</div>
<div id="todaySaved"></div>
</div>
<div id="weeklyTab" style="display:none"></div>
<div id="monthlyTab" style="display:none"></div>
<div id="allTab" style="display:none"></div>
</div>
</div>

<!-- INSTALL BUTTON - Sirf Chrome me dikhega, App me nahi -->
<div id="installBox" style="display:none">
<div>📲 App Install Karo</div>
<button onclick="installApp()">Install</button>
</div>

<script>
let deferredPrompt;
const PASSWORD = "2938";

// Login
function checkPass(){
  let p = document.getElementById('passInput').value;
  if(p === PASSWORD){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('mainApp').style.display='block';
    localStorage.setItem('loggedIn','yes');
    loadAll();
  } else {
    document.getElementById('loginError').style.display='block';
  }
}
if(localStorage.getItem('loggedIn')==='yes'){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('mainApp').style.display='block';
}

// Diary Logic
function getNotes(){
  return JSON.parse(localStorage.getItem('diaryNotes') || '[]');
}
function saveNotes(notes){
  localStorage.setItem('diaryNotes', JSON.stringify(notes));
}
function saveToday(){
  let text = document.getElementById('todayText').value.trim();
  if(!text){alert('Pehle kuch likho!');return;}
  let notes = getNotes();
  let today = new Date().toLocaleDateString('en-GB');
  notes.unshift({date: today, text: text, time: Date.now()});
  saveNotes(notes);
  document.getElementById('todayText').value='';
  alert('MashaAllah! Save ho gaya! ✅');
  loadAll();
}
function showTab(tab){
  document.getElementById('todayTab').style.display='none';
  document.getElementById('weeklyTab').style.display='none';
  document.getElementById('monthlyTab').style.display='none';
  document.getElementById('allTab').style.display='none';
  document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active'));
  if(tab==='today'){document.getElementById('todayTab').style.display='block';document.getElementById('btnToday').classList.add('active');}
  if(tab==='weekly'){document.getElementById('weeklyTab').style.display='block';document.getElementById('btnWeekly').classList.add('active');showWeekly();}
  if(tab==='monthly'){document.getElementById('monthlyTab').style.display='block';document.getElementById('btnMonthly').classList.add('active');showMonthly();}
  if(tab==='all'){document.getElementById('allTab').style.display='block';document.getElementById('btnAll').classList.add('active');showAll();}
}
function renderNotes(list, elId, title){
  let el = document.getElementById(elId);
  if(list.length===0){el.innerHTML=`<div class="write-box"><h3>${title}</h3><p style="color:#94a3b8">Abhi koi kahani nahi hai.</p></div>`;return;}
  let html=`<div class="write-box"><h3>${title} (${list.length})</h3></div>`;
  list.forEach(n=>{
    html+=`<div class="note-card"><div class="date">${n.date}</div><div class="text">${n.text}</div></div>`;
  });
  el.innerHTML=html;
}
function showWeekly(){
  let notes = getNotes().slice(0,7);
  renderNotes(notes,'weeklyTab','📊 Is Hafte Ki Kahaniyan');
}
function showMonthly(){
  let notes = getNotes().slice(0,30);
  renderNotes(notes,'monthlyTab','📆 Is Mahine Ki Kahaniyan');
}
function showAll(){
  let notes = getNotes();
  renderNotes(notes,'allTab','📔 Saari Kahaniyan');
}
function loadAll(){
  let notes = getNotes();
  let todayStr = new Date().toLocaleDateString('en-GB');
  let todayNotes = notes.filter(n=>n.date===todayStr);
  let el = document.getElementById('todaySaved');
  if(todayNotes.length>0){
    let html='<div class="write-box"><h3>✅ Aaj Ki Saved Kahaniyan</h3></div>';
    todayNotes.forEach(n=>{html+=`<div class="note-card"><div class="date">${n.date}</div><div class="text">${n.text}</div></div>`});
    el.innerHTML=html;
  } else {el.innerHTML='';}
}

// INSTALL LOGIC - Chrome me dikhega, App me nahi
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  // Sirf Chrome browser me dikhao, App me nahi
  if(!window.matchMedia('(display-mode: standalone)').matches && window.navigator.standalone !== true){
    document.getElementById('installBox').style.display='flex';
  }
});
function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choice)=>{
      if(choice.outcome==='accepted'){
        document.getElementById('installBox').style.display='none';
      }
      deferredPrompt=null;
    });
  } else {
    alert('Upar 3 dots (⋮) dabao -> Add to Home screen -> Install');
  }
}
window.addEventListener('appinstalled', ()=>{
  document.getElementById('installBox').style.display='none';
});

// Sab se important: Agar App ke andar khula hai to Install button hamesha chhupao
if(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true){
  document.getElementById('installBox').style.display='none';
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
