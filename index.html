<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HADI DAIRAY - ABDUL HADI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Naskh+Arabic&family=Amiri&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#0f0f0f;color:#fff}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;position:sticky;top:0;z-index:100}
.avatar{width:38px;height:38px;background:#ff9800;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.menu-btn{font-size:24px;background:none;border:none;color:#fff;cursor:pointer}
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:none;justify-content:flex-end}
.menu-overlay.active{display:flex}
.menu-sheet{width:82%;max-width:320px;background:#fff;color:#000;height:100%;padding:20px;animation:slideInRight 0.3s}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
.menu-item{display:flex;gap:12px;padding:14px 12px;border-radius:12px;margin-bottom:8px;cursor:pointer;background:#f5f5f5}
.menu-item.active{background:#1a1a1a;color:#fff}
.main{padding:16px;max-width:600px;margin:0 auto}
.card{background:#fff;color:#000;border-radius:18px;padding:16px;margin-bottom:16px}
.lang-toggle{display:flex;gap:8px;margin-bottom:12px}
.lang-btn{padding:6px 16px;border-radius:20px;border:1px solid #ccc;background:#eee;cursor:pointer}
.lang-btn.active{background:#1a1a1a;color:#fff}
.fonts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.font-btn{padding:5px 10px;border-radius:8px;border:1px solid #ddd;background:#fafafa;cursor:pointer;font-size:12px}
.font-btn.active{background:#ff9800;color:#fff}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-bottom:10px;font-size:16px}
textarea{min-height:160px}
.btn-primary{background:#1a1a1a;color:#fff;padding:12px;border-radius:12px;border:none;width:100%;cursor:pointer;font-weight:600}
.btn-sec{background:#f0f0f0;color:#000;padding:10px;border-radius:10px;border:none;cursor:pointer;margin:4px}
.saved-item{background:#f8f8f8;padding:12px;border-radius:12px;margin-bottom:10px;border-left:4px solid #ff9800}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal-day{padding:10px 2px;border-radius:10px;cursor:pointer;background:#f5f5f5;color:#000}
.cal-day.has{border:2px solid #ff9800}
.cal-day.today{background:#1a1a1a;color:#fff}
.cal-header{font-weight:700;padding:8px 0;font-size:13px;color:#555}
.acc-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.acc-box{background:#f5f5f5;padding:12px;border-radius:12px;text-align:center}
.person-row{display:flex;justify-content:space-between;padding:14px;background:#f9f9f9;border-radius:12px;cursor:pointer;border:1px solid #eee;margin-bottom:8px}
.badge-plus{color:#0a9e00;font-weight:700}
.badge-minus{color:#d00;font-weight:700}
.history-modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:300;display:none;align-items:center;justify-content:center;padding:16px}
.history-modal.active{display:flex}
.history-box{background:#fff;color:#000;width:100%;max-width:500px;max-height:85vh;overflow:auto;border-radius:16px;padding:16px}
.excel-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.excel-table th,.excel-table td{border:1px solid #ccc;padding:8px;text-align:center}
.excel-table th{background:#1a1a1a;color:#fff}
.hidden-pdf-div{position:fixed;left:-9999px;top:0;width:700px;background:#fff;color:#000;padding:30px;font-size:18px;line-height:2}
.urdu-text{font-family:'Noto Nastaliq Urdu',serif;direction:rtl}
</style>
</head>
<body>
<div class="top-bar"><div style="display:flex;align-items:center;gap:10px"><div class="avatar">AH</div><div><div style="font-weight:700">ABDUL HADI</div><div style="font-size:12px;color:#aaa">HADI DAIRAY</div></div></div><button class="menu-btn" onclick="document.getElementById('menuOverlay').classList.add('active')">☰</button></div>
<div class="menu-overlay" id="menuOverlay" onclick="if(event.target==this)this.classList.remove('active')"><div class="menu-sheet"><h2>ABDUL HADI</h2><div style="color:#888;font-size:13px;margin-bottom:20px">HADI DAIRAY</div><div class="menu-item active" onclick="showPage('home')">🏠 Home</div><div class="menu-item" onclick="showPage('today')">📅 Today</div><div class="menu-item" onclick="showPage('calendar')">🗓️ Calendar</div><div class="menu-item" onclick="showPage('accounting')">💰 Accounting</div><div class="menu-item" onclick="showPage('settings')">⚙️ Settings</div><div style="margin-top:20px"><button class="btn-sec" onclick="downloadAllPDF()">📄 PDF Download</button><button class="btn-sec">🔒 Lock</button></div></div></div>
<div class="main">
<div id="page-home"><div class="card"><div class="lang-toggle"><button class="lang-btn active" id="btnEn" onclick="setEditorLang('en')">English</button><button class="lang-btn" id="btnUr" onclick="setEditorLang('ur')">Urdu</button></div><div class="fonts" id="fontList"></div><input id="headingInput" placeholder="Heading"><textarea id="storyInput" placeholder="Write here..."></textarea><button class="btn-primary" onclick="saveEntry()">Save</button></div><div class="card"><h3>Saved</h3><div id="savedList"></div></div></div>
<div id="page-calendar" style="display:none"><div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><button onclick="changeMonth(-1)">‹</button><h3 id="calMonth"></h3><button onclick="changeMonth(1)">›</button></div><div class="calendar-grid" id="calWeekdays"></div><div class="calendar-grid" id="calDays" style="margin-top:8px"></div></div><div class="card"><div id="calEntries"></div></div></div>
<div id="page-today" style="display:none"><div class="card"><h3>Today's Entries</h3><div id="todayList" style="margin-top:10px"></div></div></div>
<div id="page-accounting" style="display:none"><div class="card"><h3>Accounting</h3><input id="accName" placeholder="Name e.g. Tariq, Arif"><input id="accAmount" type="number" placeholder="Amount"><select id="accType"><option value="receive">Receive (+)</option><option value="send">Send (-)</option></select><button class="btn-primary" onclick="saveAccounting()">Save Entry</button><div class="acc-summary" style="margin-top:16px"><div class="acc-box"><h4>Total Receive</h4><p id="totalReceive">0</p></div><div class="acc-box"><h4>Total Send</h4><p id="totalSend">0</p></div><div class="acc-box"><h4>Balance</h4><p id="totalBalance">0</p></div></div><button class="btn-sec" onclick="downloadAccountingPDF()">📄 Download Accounting PDF</button></div><div class="card"><h3>Names & Amounts</h3><div id="personList"></div></div></div>
<div id="page-settings" style="display:none"><div class="card"><h3>Settings</h3><p style="margin-top:10px;color:#666">App Language: English (Editor only changes)</p></div></div>
</div>
<div class="history-modal" id="historyModal" onclick="if(event.target==this)this.classList.remove('active')"><div class="history-box"><div style="display:flex;justify-content:space-between"><h3 id="historyName">History</h3><button onclick="document.getElementById('historyModal').classList.remove('active')">✕</button></div><table class="excel-table" id="historyTable"><thead><tr><th>Date</th><th>Send</th><th>Receive</th><th>Balance</th></tr></thead><tbody></tbody></table><div style="margin-top:12px"><button class="btn-sec" onclick="downloadPersonPDF()">📄 Download This Person PDF</button></div></div></div>
<div id="pdfRender" class="hidden-pdf-div"></div>
<script>
let editorLang='en',currentFont='Poppins',entries=JSON.parse(localStorage.getItem('hadi_entries')||'[]'),accEntries=JSON.parse(localStorage.getItem('hadi_acc')||'[]'),calDate=new Date(),currentHistoryName='';
const fontsEn=[{name:'Poppins',family:'Poppins'},{name:'Arial',family:'Arial'},{name:'Times',family:'Times New Roman'}];
const fontsUr=[{name:'Jameel Noori',family:'Noto Nastaliq Urdu'},{name:'Nafees',family:'Noto Nastaliq Urdu'},{name:'Naskh',family:'Noto Naskh Arabic'},{name:'Amiri',family:'Amiri'}];
function showPage(p){document.querySelectorAll('[id^="page-"]').forEach(el=>el.style.display='none');document.getElementById('page-'+p).style.display='block';document.getElementById('menuOverlay').classList.remove('active');if(p==='calendar')renderCalendar();if(p==='today')renderToday();if(p==='accounting')renderAccounting();if(p==='home')renderSaved();}
function setEditorLang(l){editorLang=l;document.getElementById('btnEn').classList.toggle('active',l==='en');document.getElementById('btnUr').classList.toggle('active',l==='ur');const h=document.getElementById('headingInput'),s=document.getElementById('storyInput');if(l==='ur'){h.placeholder='ہیڈنگ';s.placeholder='یہاں لکھیں...';h.style.direction='rtl';s.style.direction='rtl';}else{h.placeholder='Heading';s.placeholder='Write here...';h.style.direction='ltr';s.style.direction='ltr';}renderFonts();applyFont();}
function renderFonts(){const arr=editorLang==='ur'?fontsUr:fontsEn;document.getElementById('fontList').innerHTML=arr.map(f=>`<button class="font-btn ${currentFont===f.family?'active':''}" onclick="setFont('${f.family}')">${f.name}</button>`).join('');}
function setFont(f){currentFont=f;renderFonts();applyFont();}
function applyFont(){document.getElementById('headingInput').style.fontFamily=currentFont;document.getElementById('storyInput').style.fontFamily=currentFont;}
function saveEntry(){const h=document.getElementById('headingInput').value.trim(),s=document.getElementById('storyInput').value.trim();if(!h&&!s)return alert('Write something');entries.unshift({id:Date.now(),heading:h,story:s,lang:editorLang,font:currentFont,date:new Date().toISOString()});localStorage.setItem('hadi_entries',JSON.stringify(entries));document.getElementById('headingInput').value='';document.getElementById('storyInput').value='';renderSaved();}
function renderSaved(){const c=document.getElementById('savedList');if(!entries.length){c.innerHTML='<p style="color:#888">No saved</p>';return}c.innerHTML=entries.map(e=>`<div class="saved-item" style="font-family:${e.font}"><b>${e.heading||'No Heading'}</b><div style="white-space:pre-wrap" class="${e.lang==='ur'?'urdu-text':''}">${e.story}</div><div style="margin-top:8px"><button class="btn-sec" onclick="downloadSinglePDF(${e.id})">PDF</button><button class="btn-sec" onclick="entries=entries.filter(x=>x.id!==${e.id});localStorage.setItem('hadi_entries',JSON.stringify(entries));renderSaved()">Delete</button></div></div>`).join('');}
function renderCalendar(){const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];document.getElementById('calWeekdays').innerHTML=wd.map(d=>`<div class="cal-header">${d}</div>`).join('');const y=calDate.getFullYear(),m=calDate.getMonth();document.getElementById('calMonth').innerText=calDate.toLocaleString('en-US',{month:'long',year:'numeric'});const first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();let html='';for(let i=0;i<first;i++)html+='<div></div>';for(let d=1;d<=dim;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const has=entries.some(e=>e.date.startsWith(ds));const isToday=new Date().toDateString()===new Date(y,m,d).toDateString();html+=`<div class="cal-day ${has?'has':''} ${isToday?'today':''}" onclick="showDay('${ds}')">${d}</div>`;}document.getElementById('calDays').innerHTML=html;}
function changeMonth(n){calDate.setMonth(calDate.getMonth()+n);renderCalendar();}
function showDay(ds){const list=entries.filter(e=>e.date.startsWith(ds));document.getElementById('calEntries').innerHTML=list.length?list.map(e=>`<div class="saved-item"><b>${e.heading}</b><div>${e.story}</div></div>`).join(''):`<p>No entries for ${ds}</p>`;}
function renderToday(){const t=new Date().toISOString().slice(0,10);const list=entries.filter(e=>e.date.startsWith(t));document.getElementById('todayList').innerHTML=list.length?list.map(e=>`<div class="saved-item"><b>${e.heading}</b><div>${e.story}</div></div>`).join(''):'<p>No entries today</p>';}
function saveAccounting(){const name=document.getElementById('accName').value.trim(),amount=parseFloat(document.getElementById('accAmount').value),type=document.getElementById('accType').value;if(!name||!amount)return alert('Enter name and amount');accEntries.push({id:Date.now(),name,amount,type,date:new Date().toISOString()});localStorage.setItem('hadi_acc',JSON.stringify(accEntries));document.getElementById('accName').value='';document.getElementById('accAmount').value='';renderAccounting();}
function renderAccounting(){let tr=0,ts=0;accEntries.forEach(e=>{if(e.type==='receive')tr+=e.amount;else ts+=e.amount;});document.getElementById('totalReceive').innerText=tr;document.getElementById('totalSend').innerText=ts;document.getElementById('totalBalance').innerText=tr-ts;const map={};accEntries.forEach(e=>{if(!map[e.name])map[e.name]=0;map[e.name]+=e.type==='receive'?e.amount:-e.amount;});const list=document.getElementById('personList');const names=Object.keys(map);list.innerHTML=names.length?names.map(n=>`<div class="person-row" onclick="openHistory('${n}')"><span>${n}</span><span class="${map[n]>=0?'badge-plus':'badge-minus'}">${map[n]>=0?'+'+map[n]:map[n]}</span></div>`).join(''):'<p style="color:#888">No records</p>';}
function openHistory(name){currentHistoryName=name;const filtered=accEntries.filter(e=>e.name===name).sort((a,b)=>new Date(a.date)-new Date(b.date));let bal=0;document.querySelector('#historyTable tbody').innerHTML=filtered.map(e=>{bal+=e.type==='receive'?e.amount:-e.amount;return `<tr><td>${new Date(e.date).toLocaleDateString()}</td><td>${e.type==='send'?e.amount:''}</td><td>${e.type==='receive'?e.amount:''}</td><td>${bal}</td></tr>`;}).join('');document.getElementById('historyName').innerText=name+' - History';document.getElementById('historyModal').classList.add('active');}
async function downloadSinglePDF(id){const e=entries.find(x=>x.id===id);const div=document.getElementById('pdfRender');div.innerHTML=`<h2 style="font-family:${e.font}">${e.heading}</h2><div style="font-family:${e.font};white-space:pre-wrap" class="${e.lang==='ur'?'urdu-text':''}">${e.story}</div>`;const canvas=await html2canvas(div,{scale:2,useCORS:true});const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,pdf.internal.pageSize.getWidth(),(canvas.height*pdf.internal.pageSize.getWidth())/canvas.width);pdf.save((e.heading||'diary')+'.pdf');div.innerHTML='';}
async function downloadAllPDF(){const div=document.getElementById('pdfRender');let html='<h1>HADI DAIRAY - All</h1>';entries.forEach(e=>{html+=`<div style="margin-bottom:20px"><h3 style="font-family:${e.font}">${e.heading}</h3><div style="font-family:${e.font};white-space:pre-wrap" class="${e.lang==='ur'?'urdu-text':''}">${e.story}</div></div>`});div.innerHTML=html;const canvas=await html2canvas(div,{scale:2});const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,pdf.internal.pageSize.getWidth(),(canvas.height*pdf.internal.pageSize.getWidth())/canvas.width);pdf.save('HADI_DAIRAY_All.pdf');div.innerHTML='';}
async function downloadAccountingPDF(){const div=document.getElementById('pdfRender');const tr=accEntries.filter(e=>e.type==='receive').reduce((a,b)=>a+b.amount,0),ts=accEntries.filter(e=>e.type==='send').reduce((a,b)=>a+b.amount,0);let html=`<h2>Accounting</h2><p>Receive:${tr} Send:${ts} Balance:${tr-ts}</p><table border="1" cellpadding="8" style="width:100%;border-collapse:collapse"><tr><th>Date</th><th>Name</th><th>Send</th><th>Receive</th></tr>`;accEntries.forEach(e=>{html+=`<tr><td>${new Date(e.date).toLocaleDateString()}</td><td>${e.name}</td><td>${e.type==='send'?e.amount:''}</td><td>${e.type==='receive'?e.amount:''}</td></tr>`});html+='</table>';div.innerHTML=html;const canvas=await html2canvas(div,{scale:2});const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,pdf.internal.pageSize.getWidth(),(canvas.height*pdf.internal.pageSize.getWidth())/canvas.width);pdf.save('Accounting.pdf');div.innerHTML='';}
async function downloadPersonPDF(){const div=document.getElementById('pdfRender');const filtered=accEntries.filter(e=>e.name===currentHistoryName).sort((a,b)=>new Date(a.date)-new Date(b.date));let bal=0,html=`<h2>${currentHistoryName} - History</h2><table border="1" cellpadding="8" style="width:100%;border-collapse:collapse"><tr><th>Date</th><th>Send</th><th>Receive</th><th>Balance</th></tr>`;filtered.forEach(e=>{bal+=e.type==='receive'?e.amount:-e.amount;html+=`<tr><td>${new Date(e.date).toLocaleDateString()}</td><td>${e.type==='send'?e.amount:''}</td><td>${e.type==='receive'?e.amount:''}</td><td>${bal}</td></tr>`});html+='</table>';div.innerHTML=html;const canvas=await html2canvas(div,{scale:2});const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,pdf.internal.pageSize.getWidth(),(canvas.height*pdf.internal.pageSize.getWidth())/canvas.width);pdf.save(currentHistoryName+'_History.pdf');div.innerHTML='';}
renderFonts();renderSaved();renderAccounting();
</script>
</body>
                                                                                                                                                                                                                                 </html>
