<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HADI - CHAT</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Poppins,sans-serif;background:#0a1931;color:#fff;display:flex;height:100vh}
#sidebar{width:35%;background:#162447;border-right:2px solid #2ff3a3;display:flex;flex-direction:column;overflow-y:auto}
#chatArea{width:65%;display:flex;flex-direction:column}
.head{padding:15px;background:#1f4068;font-weight:bold;text-align:center;border-bottom:1px solid #2ff3a3;display:flex;justify-content:space-between;align-items:center}
.user{padding:12px 15px;border-bottom:1px solid #1f4068;cursor:pointer} .user:hover,.user.active{background:#1f4068} .user b{color:#2ff3a3}
#messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px;background:#0a1931}
.msg{background:#1f4068;padding:8px 12px;border-radius:12px;max-width:75%;word-break:break-word} .msg.me{align-self:flex-end;background:#2ff3a3;color:#0a1931}
.msg img{max-width:200px;border-radius:10px;margin-top:5px;display:block}
.input{display:flex;gap:5px;padding:10px;background:#162447;align-items:center} .input input{flex:1;padding:12px;border-radius:25px;border:none;outline:none}
.input button{border:none;padding:10px 16px;border-radius:50%;background:#2ff3a3;cursor:pointer;font-weight:bold}
#nameBox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:999}
#langBtn{font-size:11px;background:#2ff3a3;color:#0a1931;border:none;padding:5px 8px;border-radius:5px;cursor:pointer}
.inp{width:90%;padding:13px;border-radius:10px;border:none;margin:6px 0;text-align:center;font-size:15px;outline:none}
</style>
</head>
<body>
<div id="sidebar">
<div class="head">👑 HADI KI DAIRAY <button id="langBtn" onclick="toggleLang()">اردو</button></div>
<div class="user" onclick="openChat('GROUP')" id="groupBtn"><b id="groupText">🌐 Group Chat</b></div>
<div id="userList"></div>
</div>
<div id="chatArea">
<div class="head" id="chatHead">Group Chat</div>
<div id="messages"></div>
<div class="input">
<label for="imgInput" style="background:#2ff3a3;color:#0a1931;padding:10px 14px;border-radius:50%;cursor:pointer">📷</label>
<input type="file" id="imgInput" accept="image/*" hidden>
<input type="text" id="msgInput" placeholder="Type a message...">
<button onclick="sendMsg()">➤</button>
</div>
</div>

<div id="nameBox">
<div style="background:#162447;padding:25px;border-radius:15px;width:90%;max-width:350px;text-align:center;border:2px solid #2ff3a3">
<h3 id="boxTitle">Enter Your Details</h3>
<input id="mobileInput" class="inp" type="tel" placeholder="Mobile 03XX">
<input id="nameInput" class="inp" type="text" placeholder="Abdul Hadi">
<button id="startBtn" onclick="saveName()" style="width:92%;padding:13px;background:#2ff3a3;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:12px;font-size:15px">Start Chatting</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDrxztt_wMInNZ2SsYuA_Z0KfPdUhMWZDM",
  authDomain: "aafi-khan.firebaseapp.com",
  databaseURL: "https://aafi-khan-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "aafi-khan",
  storageBucket: "aafi-khan.firebasestorage.app",
  messagingSenderId: "225988422863",
  appId: "1:225988422863:web:817848e1895de0472b9bba"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let myName = localStorage.getItem("hadiName");
let myMobile = localStorage.getItem("hadiMobile");
let currentChat = "GROUP";
let isUrdu = localStorage.getItem("lang") === "ur";

if(myName && myMobile){
 document.getElementById("nameBox").style.display="none";
 document.getElementById("mobileInput").value=myMobile;
 document.getElementById("nameInput").value=myName;
}
if(isUrdu) setTimeout(applyLang,100);

window.saveName = function(){
 let mobile = document.getElementById("mobileInput").value.trim();
 let name = document.getElementById("nameInput").value.trim();
 if(!mobile){ alert("Please enter Mobile 03XX"); return; }
 if(!name){ alert("Please enter Name"); return; }
 localStorage.setItem("hadiName", name);
 localStorage.setItem("hadiMobile", mobile);
 myName = name; myMobile = mobile;
 document.getElementById("nameBox").style.display="none";
 push(ref(db,"users"),{name:name, mobile:mobile, time:Date.now()}).catch(()=>{});
}

window.toggleLang = function(){
 isUrdu = !isUrdu;
 localStorage.setItem("lang", isUrdu ? "ur" : "en");
 applyLang();
}

function applyLang(){
 if(isUrdu){
  document.getElementById("groupText").innerText="🌐 گروپ چیٹ";
  document.getElementById("chatHead").innerText="گروپ چیٹ";
  document.getElementById("boxTitle").innerText="تفصیلات لکھیں";
  document.getElementById("mobileInput").placeholder="موبائل 03XX";
  document.getElementById("nameInput").placeholder="عبد الہادی";
  document.getElementById("startBtn").innerText="شروع کرو";
  document.getElementById("msgInput").placeholder="میسج لکھو...";
  document.getElementById("langBtn").innerText="English";
 } else {
  document.getElementById("groupText").innerText="🌐 Group Chat";
  document.getElementById("chatHead").innerText="Group Chat";
  document.getElementById("boxTitle").innerText="Enter Your Details";
  document.getElementById("mobileInput").placeholder="Mobile 03XX";
  document.getElementById("nameInput").placeholder="Abdul Hadi";
  document.getElementById("startBtn").innerText="Start Chatting";
  document.getElementById("msgInput").placeholder="Type a message...";
  document.getElementById("langBtn").innerText="اردو";
 }
}

onValue(ref(db,"users"),(snap)=>{
 const list=document.getElementById("userList"); list.innerHTML="";
 let users = new Set();
 snap.forEach(c=>{
  let v=c.val(); let u=v.name; if(u && u!==myName) users.add(u);
 });
 users.forEach(u=>{
  let d=document.createElement("div"); d.className="user"; d.innerText="👤 "+u; d.onclick=()=>openChat(u); d.id="user-"+u;
  if(currentChat===u) d.classList.add("active"); list.appendChild(d);
 })
});

window.openChat = function(chatId){
 currentChat=chatId;
 document.getElementById("chatHead").innerText = chatId==="GROUP" ? (isUrdu?"🌐 گروپ چیٹ":"Group Chat") : "👤 "+chatId;
 document.querySelectorAll(".user").forEach(e=>e.classList.remove("active"));
 let el = chatId==="GROUP" ? document.getElementById("groupBtn") : document.getElementById("user-"+chatId);
 if(el) el.classList.add("active");
 document.getElementById("messages").innerHTML="";
 loadMessages();
}

function getRoomId(){ if(currentChat==="GROUP") return "GROUP"; return [myName, currentChat].sort().join("_PRIVATE_"); }

function loadMessages(){
 document.getElementById("messages").innerHTML="";
 const roomRef = ref(db,"chats/"+getRoomId());
 onChildAdded(roomRef,(data)=>{
  let m=data.val(); if(!m) return;
  let div=document.createElement("div"); div.className="msg"+(m.name===myName?" me":"");
  let content = m.image ? `<img src="${m.image}"><br>${m.text||""}` : (m.text||"");
  div.innerHTML=`<small style="font-size:10px;opacity:.7">${m.name||""}</small><br>${content}`;
  document.getElementById("messages").appendChild(div);
  document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
 });
}

window.sendMsg = function(){
 let txt=document.getElementById("msgInput").value.trim();
 if(!txt && !window.tempImage) return;
 push(ref(db,"chats/"+getRoomId()),{name:myName, text:txt, image:window.tempImage||"", time:Date.now()});
 document.getElementById("msgInput").value=""; window.tempImage=null;
}

document.getElementById("imgInput").addEventListener("change",(e)=>{
 let file=e.target.files[0]; if(!file) return; if(file.size>800000){ alert("Image must be <800KB"); return; }
 let r=new FileReader(); r.onload=()=>{ window.tempImage=r.result; sendMsg(); }; r.readAsDataURL(file);
});
document.getElementById("msgInput").addEventListener("keypress",(e)=>{ if(e.key==="Enter") sendMsg(); });

loadMessages();
</script>
</body>
</html>
