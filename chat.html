<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HADI - CHAT</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Poppins,sans-serif;background:#0a1931;color:#fff;display:flex;height:100vh}
#sidebar{width:35%;background:#162447;border-right:2px solid #2ff3a3;display:flex;flex-direction:column} #chatArea{width:65%;display:flex;flex-direction:column}
.head{padding:15px;background:#1f4068;font-weight:bold;text-align:center;border-bottom:1px solid #2ff3a3}
.user{padding:12px 15px;border-bottom:1px solid #1f4068;cursor:pointer} .user:hover,.user.active{background:#1f4068} .user b{color:#2ff3a3}
#messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px;background:#0a1931}
.msg{background:#1f4068;padding:8px 12px;border-radius:12px;max-width:75%;word-break:break-word} .msg.me{align-self:flex-end;background:#2ff3a3;color:#0a1931}
.msg img{max-width:200px;border-radius:10px;margin-top:5px;display:block}
.input{display:flex;gap:5px;padding:10px;background:#162447;align-items:center} .input input{flex:1;padding:12px;border-radius:25px;border:none;outline:none}
.input button{border:none;padding:10px 14px;border-radius:50%;background:#2ff3a3;cursor:pointer;font-weight:bold}
#nameBox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:999}
</style>
</head>
<body>
<div id="sidebar">
<div class="head">👑 HADI KI DAIRAY</div>
<div class="user" onclick="openChat('GROUP')" id="groupBtn"><b>🌐 گروپ چیٹ (سب دوست)</b></div>
<div id="userList"></div>
</div>
<div id="chatArea">
<div class="head" id="chatHead">گروپ چیٹ</div>
<div id="messages"></div>
<div class="input">
<label for="imgInput" style="background:#2ff3a3;color:#0a1931;padding:10px 14px;border-radius:50%;cursor:pointer">📷</label>
<input type="file" id="imgInput" accept="image/*" hidden>
<input type="text" id="msgInput" placeholder="میسج لکھو...">
<button onclick="sendMsg()">➤</button>
</div>
</div>
<div id="nameBox"><div style="background:#162447;padding:25px;border-radius:15px;width:90%;max-width:350px;text-align:center">
<h3>اپنا نام لکھو</h3><input id="nameInput" placeholder="عبد الہادی" style="width:90%;padding:12px;border-radius:10px;border:none;margin:12px 0">
<button onclick="saveName()" style="width:100%;padding:12px;background:#2ff3a3;border:none;border-radius:10px;font-weight:bold">شروع کرو</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDrxztt_wMInNZ2SsYuA_Z0KfPdUhMWZDM",
  authDomain: "aafi-khan.firebaseapp.com",
  databaseURL: "https://aafi-khan-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "aafi-khan",
  storageBucket: "aafi-khan.firebasestorage.app",
  messagingSenderId: "225988422863",
  appId: "1:225988422863:web:817848e1895de0472b9bba",
  measurementId: "G-GP6J4GZ8PM"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let myName = localStorage.getItem("hadiName");
let currentChat = "GROUP";
let allUsers = new Set();
if(myName) document.getElementById("nameBox").style.display="none";

window.saveName = ()=>{
 let n=document.getElementById("nameInput").value.trim();
 if(!n) return alert("نام لکھو"); localStorage.setItem("hadiName",n); myName=n;
 document.getElementById("nameBox").style.display="none";
 push(ref(db,"users"),{name:n});
}

onValue(ref(db,"users"),(snap)=>{
 const list=document.getElementById("userList"); list.innerHTML="";
 allUsers.clear();
 snap.forEach(c=>{ let u=c.val().name; if(u!==myName){ allUsers.add(u); } });
 allUsers.forEach(u=>{
  let d=document.createElement("div"); d.className="user"; d.innerHTML=`👤 ${u}`; d.onclick=()=>openChat(u); d.id="user-"+u;
  if(currentChat===u) d.classList.add("active"); list.appendChild(d);
 })
});

window.openChat = (chatId)=>{
 currentChat=chatId;
 document.getElementById("chatHead").innerText = chatId==="GROUP" ? "🌐 گروپ چیٹ" : `👤 ${chatId} سے بات`;
 document.querySelectorAll(".user").forEach(e=>e.classList.remove("active"));
 if(chatId!=="GROUP") document.getElementById("user-"+chatId)?.classList.add("active");
 else document.getElementById("groupBtn").classList.add("active");
 document.getElementById("messages").innerHTML="";
 loadMessages();
}

function getRoomId(){ if(currentChat==="GROUP") return "GROUP"; return [myName, currentChat].sort().join("_PRIVATE_"); }

function loadMessages(){
 document.getElementById("messages").innerHTML="";
 const roomRef = ref(db,"chats/"+getRoomId());
 onChildAdded(roomRef,(data)=>{
  let m=data.val(); let div=document.createElement("div"); div.className="msg"+(m.name===myName?" me":"");
  let content = m.image ? `<img src="${m.image}"><br>${m.text||""}` : m.text;
  div.innerHTML=`<small style="font-size:10px;opacity:.7">${m.name}</small><br>${content}`;
  document.getElementById("messages").appendChild(div);
  document.getElementById("messages").scrollTop=99999;
 });
}

window.sendMsg = ()=>{
 let txt=document.getElementById("msgInput").value.trim();
 if(!txt && !window.tempImage) return;
 push(ref(db,"chats/"+getRoomId()),{name:myName,text:txt,image:window.tempImage||"",time:Date.now()});
 document.getElementById("msgInput").value=""; window.tempImage=null;
}

document.getElementById("imgInput").addEventListener("change",(e)=>{
 let file=e.target.files[0]; if(!file) return; if(file.size>800000) return alert("تصویر 800KB سے کم رکھو");
 let r=new FileReader(); r.onload=()=>{ window.tempImage=r.result; sendMsg(); }; r.readAsDataURL(file);
});
document.getElementById("msgInput").addEventListener("keypress",(e)=>{ if(e.key==="Enter") sendMsg(); });
loadMessages();
</script>
</body>
</html>
